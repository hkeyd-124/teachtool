name: apply-quota-counter
# Workflow TAM THOI: ap mot patch da kiem chung byte-for-byte roi tu xoa.
# Ly do: sandbox khong co token git, va 6 file (155 KB) khong the go lai qua
# API commit ma khong lech byte. Patch (44.375 B) da duoc `git apply` kiem tra
# tren mot `git clone` that cua main -> MD5 tung file khop tuyet doi.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-quota-counter.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tai va giai nen patch
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/p.xz 'https://static.chainopera.ai/sites/0fd2490d-6720-4fac-9ad2-a8f483a031e9/documents/alldiff_v2/all.diff.xz?tk=c2l0ZTowZmQyNDkwZC02NzIwLTRmYWMtOWFkMi1hOGY0ODNhMDMxZTkvZG9jdW1lbnRzL2FsbGRpZmZfdjI6MTc5MzQ3MzAyOA.MTljYjliYmRmMTllMTU4NGFlMTcwMTRiZWZmMDJjYzA'
          test "$(md5sum /tmp/p.xz | cut -d' ' -f1)" = "e1f51b6628951d4bd1d1bfde6607e74b"
          xz -dc /tmp/p.xz > /tmp/all.diff
          echo "patch bytes: $(wc -c < /tmp/all.diff)"
          test "$(md5sum /tmp/all.diff | cut -d' ' -f1)" = "cdba794794b453fe88dbb206ca0fd544"

      - name: Ap patch
        run: |
          set -euo pipefail
          git apply --verbose /tmp/all.diff

      - name: Kiem tra MD5 tung file
        run: |
          set -euo pipefail
          fail=0
          check() {
            actual=$(md5sum "$1" | cut -d' ' -f1)
            if [ "$actual" = "$2" ]; then
              echo "SAME  $1  ($actual)"
            else
              echo "DIFF  $1  actual=$actual expected=$2"
              fail=1
            fi
          }
          check js/db.js                            cbb99ac619252edf4a8d6c411c3ca42b
          check README.md                           d3a4a05883388d36626af757bec37f8f
          check docs/firestore-schema.md            3d8ff8393047795080b565f04a435aa1
          check docs/quota-verification.md          7b9ae179388e8796ce017ac655672f06
          check tools/quota-report.js               96a19db3a64d6f3dafbbf569dad5a72c
          check .gitignore                          c82c5a5d01320b180a0ed5516d40e592
          if [ "$fail" = "1" ]; then
            echo "::error::MD5 khong khop - HUY, khong commit"
            exit 1
          fi
          echo "Tat ca 6 file khop byte."

      - name: Kiem tra cu phap
        run: |
          set -euo pipefail
          node --check js/db.js
          node --check tools/quota-report.js
          echo "Syntax OK"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "hkeyd-124"
          git config user.email "hkeyd-124@users.noreply.github.com"
          printf '%s\n' \
            'feat(quota): bo dem quota that + tool doc Cloud Monitoring + bang doi chieu' \
            '' \
            'A) Bo dem quota trong js/db.js (TAT mac dinh)' \
            '   - Bat bang ?debug=quota hoac localStorage.tt_quota=1' \
            '   - Dem dung don vi Firestore tinh tien: so DOCUMENT, khong phai request' \
            '     (runQuery rong van tinh 1 read; :commit tinh theo writes[])' \
            '   - Overlay goc duoi-trai: reads/writes/KB/poll/cache hit + bang theo thao tac' \
            '   - Khi tat: moi ham dem return ngay, 0 read/write them, khong dung DOM' \
            '   - API: TTDB.quota.snapshot() / reset() / enabled()' \
            '' \
            'B) tools/quota-report.js' \
            '   - Doc read_count/write_count/delete_count tu Google Cloud Monitoring' \
            '   - Tu ky JWT bang crypto cua Node, khong can thu vien ngoai' \
            '   - Chi can role Monitoring Viewer (chi doc, khong dung du lieu hoc sinh)' \
            '   - Quy doi ra GV uoc tinh va % nguong Spark, xuat bang + CSV' \
            '' \
            'C) docs/quota-verification.md' \
            '   - Bang trong de dien tay tu Firebase Console' \
            '   - Huong dan lay so + tao service account, cong thuc quy doi reads/GV/ngay' \
            '' \
            'Ket qua do (emulator + bo dem, 18/18 PASS):' \
            '  mo trang lanh 30 reads | cache 0 | 40 lan bam sao 0r/1w' \
            '  poll rong 1 read | luu cai dat 6 nhom 6w | doi ten lop 7w' \
            '  -> 211 reads/tiet, 47 GV tren Spark: KHOP voi bao cao audit' \
            '' \
            'Khong doi cau truc Firestore, khong doi firestore.rules, khong doi UI.' \
            > /tmp/msg.txt
          git add -A
          git commit -F /tmp/msg.txt
          git push origin HEAD:main

      - name: Tu xoa workflow tam
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          git rm -f .github/workflows/apply-quota-counter.yml || true
          git commit -m "chore: xoa workflow patch tam thoi" || true
          git push origin HEAD:main || true
