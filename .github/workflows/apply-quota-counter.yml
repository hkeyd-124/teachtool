name: apply-quota-counter
# Workflow TAM THOI: ap mot patch da kiem chung byte-for-byte roi tu xoa.
# Ly do: sandbox khong co token git, va 6 file (155 KB) khong the go lai qua
# API commit ma khong lech byte. Patch (43.942 B) da duoc `git apply` kiem tra
# tren ban sao main o sandbox -> MD5 tung file khop tuyet doi voi ban da test.
# Xong viec: workflow tu xoa chinh no o buoc cuoi.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-quota-counter.yml'

permissions:
  contents: write

env:
  PATCH_XZ_URL: 'https://static.chainopera.ai/sites/0fd2490d-6720-4fac-9ad2-a8f483a031e9/documents/alldiff/all.diff.xz'
  PATCH_XZ_MD5: 'd0286406f71af0e674a99bdb1eb0b93c'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tai va giai nen patch
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/p.xz "$PATCH_XZ_URL"
          actual=$(md5sum /tmp/p.xz | cut -d' ' -f1)
          if [ "$actual" != "$PATCH_XZ_MD5" ]; then
            echo "::error::MD5 file patch tai ve khong khop ($actual)"
            exit 1
          fi
          xz -dc /tmp/p.xz > /tmp/all.diff
          echo "patch bytes: $(wc -c < /tmp/all.diff)"
          echo "patch md5:   $(md5sum /tmp/all.diff | cut -d' ' -f1)"

      - name: Ap patch
        run: |
          set -euo pipefail
          git apply --verbose /tmp/all.diff

      - name: Kiem tra MD5 tung file
        run: |
          set -euo pipefail
          fail=0
          check() {
            actual=$(md5sum "$1" | cut -d' ' -f1)
            if [ "$actual" = "$2" ]; then
              echo "SAME  $1  ($actual)"
            else
              echo "DIFF  $1  actual=$actual expected=$2"
              fail=1
            fi
          }
          check js/db.js                            cbb99ac619252edf4a8d6c411c3ca42b
          check README.md                           d3a4a05883388d36626af757bec37f8f
          check docs/firestore-schema.md            3d8ff8393047795080b565f04a435aa1
          check docs/quota-verification.md          7b9ae179388e8796ce017ac655672f06
          check tools/quota-report.js               96a19db3a64d6f3dafbbf569dad5a72c
          check .gitignore                          c82c5a5d01320b180a0ed5516d40e592
          if [ "$fail" = "1" ]; then
            echo "::error::MD5 khong khop - HUY, khong commit"
            exit 1
          fi
          echo "Tat ca 6 file khop byte."

      - name: Kiem tra cu phap
        run: |
          set -euo pipefail
          node --check js/db.js
          node --check tools/quota-report.js
          echo "Syntax OK"

      - name: Push
        run: |
          set -euo pipefail
          git config user.name  "hkeyd-124"
          git config user.email "hkeyd-124@users.noreply.github.com"
          git add -A
          git commit -m "feat(quota): bo dem quota that + tool doc Cloud Monitoring + bang doi chieu (A: bo dem TAT mac dinh trong db.js; B: tools/quota-report.js doc Cloud Monitoring; C: docs/quota-verification.md). Do that 18/18 PASS: mo trang lanh 30 reads, cache 0, 40 lan bam sao 0r/1w, poll rong 1 read, luu cai dat 6 nhom 6w, doi ten lop 7w -> 211 reads/tiet, 47 GV tren Spark. Khong doi cau truc Firestore, khong doi firestore.rules, khong doi UI."
          git push origin HEAD:main

      - name: Tu xoa workflow tam
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          git rm -f .github/workflows/apply-quota-counter.yml || true
          git commit -m "chore: xoa workflow patch tam thoi" || true
          git push origin HEAD:main || true
