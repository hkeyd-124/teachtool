name: fix-gitignore-and-doc
# Workflow TAM THOI: sua 2 loi trong commit truoc roi tu xoa.
#  1) .gitignore bi ghi de lam MAT cac quy tac san co (.env, .env.*, *.pem,
#     *.key, .vercel/, .next/, dist/, build/, .cache/, *.tsbuildinfo,
#     npm-debug.log*, yarn-*, pnpm-*). Nghiem trong nhat: .env khong con bi chan.
#     -> khoi phuc nguyen ven ban goc + chi THEM cac quy tac service account.
#  2) docs/firestore-schema.md con tro toi `node opt/test2.js` - file khong ton
#     tai trong repo -> thay bang huong dan dung.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-gitignore-and-doc.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Giai nen patch
        run: |
          set -euo pipefail
          cat > /tmp/p.b64 <<'XZEOF'
          /Td6WFoAAATm1rRGAgAhARwAAAAQz1jM4AZbA2xdADIaSQnC/BF9UN4KT0fM8VPyou8JuU4U7iW0ucQ3jU8JBaLO9j/GAbbVYo9P
          OF7skbqKnfEJrvZ/Bcr7DdcA7BYrEyAJu73VFxDhw2ceaOFJmDQSplb+lHfW6GtvfoiqOTpipSBkmin6vU1OAAqVAcS4QP8QnOfV
          gdKCXWee4a3LPTfwB2WqeLCJPpMrldAoUprlMp/C/50QtQ1bQ1W9CEVxGzARQmhSvZ/YmIDicjm0hjQBUEFB7yIK2ZaVGj6ziDeQ
          wCmXoR0v+qwnOM59n7B7CoNJGxaXaFCsWmLk9TOanTFEh/jpzceuVgHbi5AkZqogQlk3fBj8ov5T7a4uVGTNLxJTnU0Eue++R1RS
          KjiHTHqQce2iNF03W3dPZE/kshCc5xAx+AExaz5FXnzJzZHXPnbbGGD+qPFdsSsyWzKTNb9h+MPeC5YvxpT9IusjJRUbcfqdsU3F
          i57ADBI+sdg9IVsHu6aHG3URzcf9dw0i1KNtzvXHca5wsIDV/2hSwVYviFww+BsImon1LYmuVIInVgwUP7YCEg01w2Eh1jLC7XId
          REknkOSf8Qfr3qzO/5M9MSrUiIaEqWGin7IhCYChKd1QW+nXgyi57M/nc8hre1F25Pe2lGa6+wPtrhSzXwm3VgdubTrrD21zxIEo
          zK3vUFSlFwyPLzHZERZR+hoEspe0WE+ub+6cOx2wuvpqaNj6VMrnq0vVke6/rzzNNR+nf9+kW7z/bSxRMQhd/pfMLBT/KiEGOLmS
          vSttCccnzhxYfI53TDu0nx0aF5xtFyS3hTUuLhCw0hHdcg5CrfaJnX0Dw1Kej1j9G698zjwcm3ZIy1TJEHy+aK2PT4vu0FJ38K2A
          qSR42VhBKHCqIsUpOl8qpvCzQhVcEy0fYKKd6zRxN6+jMnWpMNTRuYrTg0BCRQ4snkm4BVn7hkRXnK66GP4yMaJ+oSNC+YodO1dO
          bhitH/MDXBZx3zJu7FrvQVf4OdqDmf9o0vFuepSO/UofqGzb5eaXqPt2O8KxQRJ0tnJCjWbFSeBYvDAEBRPapqsCEumwNyFwBs7X
          lXJrYVpiSgKnDi/FKvW+1xW9giQBXRnLiu8YUMVuC+2t2hEtrE3WLjWva9LV6s3gWZGdgkQD4kC6lMF7XSqM5iJxIsOQkVx/m9Vb
          XxapyZWW4AAabChv+rvfRAABiAfcDAAAPWEO5rHEZ/sCAAAAAARZWg==
          XZEOF
          tr -d '\n' < /tmp/p.b64 | base64 -d | xz -d > /tmp/fix.diff
          test "$(md5sum /tmp/fix.diff | cut -d' ' -f1)" = "3b537b67639500d3d0bae39ff62b6b37"

      - name: Ap patch
        run: |
          set -euo pipefail
          git apply --verbose /tmp/fix.diff

      - name: Kiem tra .gitignore khoi phuc du quy tac
        run: |
          set -euo pipefail
          test "$(md5sum .gitignore | cut -d' ' -f1)" = "fd3d94c55e6cc225b1553a295f6f80b5"
          test "$(md5sum docs/firestore-schema.md | cut -d' ' -f1)" = "21c697c021359b846676e0858f411b13"
          # moi quy tac goc phai con
          for p in '.env' '.env.*' '!.env.example' '*.pem' '*.key' 'serviceAccountKey.json' \
                   'firebase-service-account*.json' 'node_modules/' '.pnpm-store/' '.vercel/' \
                   '.next/' 'dist/' 'build/' '.cache/' '*.tsbuildinfo' '*.log' \
                   'npm-debug.log*' 'yarn-debug.log*' 'yarn-error.log*' 'pnpm-debug.log*' \
                   '.DS_Store' 'Thumbs.db' '.idea/' '.vscode/' '*.swp'; do
            grep -qxF "$p" .gitignore || { echo "::error::THIEU quy tac: $p"; exit 1; }
          done
          # va phai co quy tac moi
          for p in '.secrets/' 'serviceAccount*.json' '*-key.json' 'quota.csv'; do
            grep -qxF "$p" .gitignore || { echo "::error::THIEU quy tac moi: $p"; exit 1; }
          done
          echo "OK: 24 quy tac goc con du + 4 quy tac moi"
          # khong con tro toi file khong ton tai
          if grep -q 'opt/test2.js' docs/firestore-schema.md; then
            echo "::error::van con tro toi opt/test2.js"; exit 1
          fi
          echo "OK: khong con tham chieu file khong ton tai"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "hkeyd-124"
          git config user.email "hkeyd-124@users.noreply.github.com"
          printf '%s\n' \
            'fix: khoi phuc .gitignore bi ghi de + bo tham chieu file khong ton tai' \
            '' \
            'Commit truoc (ef76306) ghi de .gitignore bang ban rut gon, lam MAT cac' \
            'quy tac san co: .env, .env.*, *.pem, *.key, serviceAccountKey.json,' \
            'firebase-service-account*.json, .pnpm-store/, .vercel/, .next/, dist/,' \
            'build/, .cache/, *.tsbuildinfo, npm-debug.log*, yarn-debug.log*,' \
            'yarn-error.log*, pnpm-debug.log*.' \
            '' \
            'Nghiem trong nhat: .env khong con bi chan -> co the lo bi mat.' \
            'Da khoi phuc nguyen ven ban goc va chi THEM quy tac cho service account' \
            'cua tools/quota-report.js (.secrets/, serviceAccount*.json, *-key.json,' \
            'quota.csv). Khong xoa quy tac nao.' \
            '' \
            'docs/firestore-schema.md: bo dong tro toi `node opt/test2.js` (file khong' \
            'ton tai trong repo), thay bang huong dan dung bo dem ?debug=quota va' \
            'tools/quota-report.js.' \
            > /tmp/msg.txt
          git add -A
          git commit -F /tmp/msg.txt
          git push origin HEAD:main

      - name: Tu xoa workflow tam
        if: always()
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          git rm -f .github/workflows/fix-gitignore-and-doc.yml || true
          git commit -m "chore: xoa workflow fix tam thoi" || true
          git push origin HEAD:main || true
