name: patch-star-race-rename-class
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified hunks
        env:
          HUNKS_URL: "https://static.chainopera.ai/files/af14c78c-1c5e-482b-877b-cac039179d28/ops_plain.json?tk=ZmlsZTphZjE0Yzc4Yy0xYzVlLTQ4MmItODc3Yi1jYWMwMzkxNzlkMjg6MTc5MzQ2OTA5OQ.MjFmNzUxMWRhOWRmODdjZWM2NTUzOTYzNTMzOTA1MzU"
        run: |
          set -euo pipefail
          python3 .github/patch_files.py
      - name: Commit result and remove helper files
        run: |
          set -euo pipefail
          git config user.name "ChainOpera Agent"
          git config user.email "agent@chainopera.ai"
          git add -A
          git commit -F - <<'MSG'
          feat(star-race): them doi ten lop, dong bo className cua moi nhom

          - js/db.js: renameClassEverywhere() - 1 write meta/hierarchy + N write
            className (updateMask, ~60B/nhom), gop :commit chia lo 400 write.
            Khong gui students/stars/total nen khong ghi de star cua may khac.
          - features/star-race/index.html: nut doi ten tren moi the lop, modal
            cung phong cach modal Cai dat nhom, validate trim/rong/60 ky tu,
            UI lac quan + tu hoan tac ten cu neu ghi loi, bao tien trinh.
          - Sua loi that: che do Local goi localSave() khi chua nap danh sach
            nhom -> ghi [] va xoa mat nhom. Nay chi goi khi state.groups da co.
          - docs/firestore-schema.md + README.md: bang chi phi + giai thich.
          - firestore.rules: KHONG doi (da cho phep className 1-60).
          MSG
          git rm -q .github/patch_files.py .github/workflows/patch-star-race-rename-class.yml
          git commit -q -m "chore: xoa script patch tam thoi"
          git push origin HEAD:main
